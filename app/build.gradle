plugins {
    id 'com.android.application'
}

android {
    namespace 'com.appcloner'
    compileSdk 34

    defaultConfig {
        applicationId "com.appcloner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // APK parsing library
    implementation 'net.dongliu:apk-parser:2.6.10'

    // ARSCLib - Android resource manipulation (binary XML, resources)
    implementation 'com.reandroid:ARSCLib:1.2.4'

    // APK signing
    implementation 'com.android.tools.build:apksig:8.2.0'
}
